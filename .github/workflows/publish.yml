name: Publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          prepare-publish: "true"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun pm pack --ignore-scripts
      - run: npm publish ./sebastienelet-agent-skills-0.2.0.tgz --provenance --access public --registry https://registry.npmjs.org --ignore-scripts
