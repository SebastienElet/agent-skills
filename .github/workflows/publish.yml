name: Publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          prepare-publish: "true"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun pm pack --ignore-scripts
      - run: npm publish ./sebastienelet-agent-skills-0.3.0.tgz --provenance --access public --registry https://registry.npmjs.org --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" --target "$TARGET_SHA" --generate-notes
