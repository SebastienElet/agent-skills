name: Prepare package tools
description: Install Bun and optionally prepare the publication toolchain
inputs:
  prepare-publish:
    description: Prepare Node and npm for publication
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.3
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.prepare-publish == 'true'
      with:
        node-version: 24.21.0
        registry-url: https://registry.npmjs.org
        package-manager-cache: false
    - if: inputs.prepare-publish == 'true'
      shell: bash
      run: |
        node --version
        npm --version
        npm config get registry
